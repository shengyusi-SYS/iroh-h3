[workspace]
members = ["iroh-h3", "iroh-h3-client", "iroh-h3-axum"]

resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Le-Maz/iroh-h3"
homepage = "https://github.com/Le-Maz/iroh-h3"
readme = "README.md"
keywords = ["quic", "h3", "http3", "iroh", "p2p"]
categories = ["network-programming", "asynchronous", "web-programming"]
authors = ["Lech Mazur <mazurlech@proton.me>"]

[workspace.dependencies]
iroh = "1.2.0"

[patch.crates-io]
# n0-watcher 1.0.0 predates upstream Waker cleanup fixes #63 and #64.
# Consumers must repeat this patch in their workspace root until a fixed release exists.
n0-watcher = { git = "https://github.com/n0-computer/n0-watcher.git", rev = "3b8cd02b29343f901ab3dba9c49c55480c5c9c31" }
